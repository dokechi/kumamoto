<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>司令塔</title>
<style>
html,body{height:100%;margin:0}body{background:#008080;font-family:Tahoma,"MS UI Gothic","MS Gothic",sans-serif;display:grid;place-items:center;color:#111}.box{width:min(520px,calc(100vw - 32px));background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:2px 2px #000}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:4px 7px}.body{padding:18px}.bar{height:20px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:2px;overflow:hidden}.fill{height:100%;width:35%;background:#000080;animation:move 1s linear infinite}@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}.err{color:#900;font-weight:700}
</style>
</head>
<body>
<div class="box"><div class="title">司令塔 - 起動中</div><div class="body"><b>PERSONAL COMMAND CENTER</b><p id="msg">司令塔 ver 0.98 を読み込んでいます...</p><div class="bar"><div class="fill"></div></div></div></div>
<script>
(async()=>{try{
 const r=await fetch('https://yibtmqsbyodhsudenktm.supabase.co/functions/v1/command-center-static-bundle',{cache:'no-store'});
 if(!r.ok)throw new Error('HTTP '+r.status);
 const d=await r.json();if(!d?.ok||!d?.b64)throw new Error(d?.error||'bundle error');
 const raw=atob(d.b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 const html=new TextDecoder('utf-8').decode(bytes);
 document.open();document.write(html);document.close();
}catch(e){const m=document.getElementById('msg');m.className='err';m.textContent='起動に失敗しました：'+(e.message||e);}})();
</script>
</body>
</html>
