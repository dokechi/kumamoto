name: Site quality

on:
  pull_request:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: site-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check HTML, internal links, metadata and deadlines
        run: python .github/check-site.py --nu
      - name: Check external links on scheduled and manual runs
        if: github.event_name != 'pull_request'
        run: python .github/check-site.py --external-links
