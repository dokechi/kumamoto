<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ef">
  <link rel="icon" href="data:,">
  <meta name="description" content="2026年7月熊本地震の支援情報を、被災した住民、被災した会社、復旧・施工で来ている会社や現場の人に分けて案内します。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="熊本の支援情報">
  <meta property="og:description" content="被災した住民・会社と、復旧・施工で来ている人へ。">
  <meta property="og:url" content="https://dokechi.github.io/kumamoto/">
  <title>熊本の支援情報</title>
  <link rel="canonical" href="https://dokechi.github.io/kumamoto/">
  <script>
    // 以前の /kumamoto/#obstacle などの共有URLを壊さないため、
    // ハッシュ付きアクセスは従来の住民向けページへ引き継ぐ。
    if (location.hash) {
      location.replace('./resident.html' + location.search + location.hash);
    }
  </script>
  <style>
    :root{
      --ink:#17191d;
      --muted:#66645f;
      --page:#fbfaf8;
      --card:#fff;
      --line:#dedbd6;
      --mocha:#9c8578;
      --mocha-soft:#f2ebe6;
      --sage:#8fa193;
      --sage-soft:#edf2ee;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      background:var(--page);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    .skip-link{position:fixed;top:8px;left:8px;z-index:10;padding:10px 14px;border-radius:10px;background:#fff;color:var(--ink);font-weight:900;transform:translateY(-150%)}
    .skip-link:focus{transform:translateY(0)}
    .site-header{
      height:66px;
      display:flex;
      align-items:center;
      border-bottom:1px solid #e5e2dd;
      background:rgba(255,255,255,.72);
    }
    .site-header__inner{
      width:100%;
      padding:0 28px;
    }
    .site-header__brand{
      font-size:14px;
      font-weight:850;
      letter-spacing:-.02em;
    }
    main{
      width:min(720px,calc(100% - 40px));
      margin:0 auto;
      padding:24px 0 74px;
    }
    .intro{
      margin:0 0 20px;
    }
    .intro h1{
      margin:0;
      font-size:clamp(44px,4.3vw,64px);
      line-height:1.02;
      letter-spacing:-.055em;
      font-weight:900;
    }
    .intro p{
      margin:10px 0 0;
      font-size:17px;
      line-height:1.45;
      font-weight:650;
      letter-spacing:-.02em;
    }
    .choice-list{
      display:grid;
      gap:12px;
    }
    .choice{
      position:relative;
      display:flex;
      align-items:center;
      min-height:296px;
      padding:42px 72px 42px 20px;
      overflow:hidden;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      text-decoration:none;
      transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    }
    .choice::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:6px;
      background:var(--accent);
    }
    .choice:hover{
      transform:translateY(-1px);
      border-color:#ccc6bf;
      box-shadow:0 8px 24px rgba(68,56,48,.06);
    }
    .choice:focus-visible{
      outline:3px solid rgba(156,133,120,.28);
      outline-offset:3px;
    }
    .choice--work{--accent:var(--mocha);--accent-text:#6b5a51}
    .choice--resident{--accent:var(--sage);--accent-text:#4d6053}
    .choice__content{width:100%}
    .choice__label{
      display:block;
      margin:0 0 8px;
      color:var(--accent-text);
      font-size:14px;
      line-height:1;
      font-weight:900;
    }
    .choice h2{
      margin:0;
      font-size:42px;
      line-height:1.08;
      letter-spacing:-.045em;
      font-weight:900;
    }
    .choice p{
      margin:12px 0 0;
      font-size:16px;
      line-height:1.55;
      font-weight:620;
      letter-spacing:-.015em;
    }
    .choice__arrow{
      position:absolute;
      right:28px;
      top:50%;
      transform:translateY(-50%);
      color:#5f6468;
      font-family:Arial,sans-serif;
      font-size:28px;
      font-weight:400;
    }
    .page-note{
      margin:20px 2px 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
    }
    @media(max-width:600px){
      .site-header{height:56px}
      .site-header__inner{padding:0 18px}
      main{
        width:min(100% - 28px,720px);
        padding-top:28px;
        padding-bottom:52px;
      }
      .intro{margin-bottom:18px}
      .intro h1{
        font-size:42px;
        line-height:1.04;
      }
      .intro p{
        margin-top:9px;
        font-size:15px;
      }
      .choice-list{gap:10px}
      .choice{
        min-height:224px;
        padding:32px 52px 32px 18px;
        border-radius:14px;
      }
      .choice::before{width:5px}
      .choice__label{font-size:13px;margin-bottom:8px}
      .choice h2{font-size:34px}
      .choice p{font-size:14px;line-height:1.55}
      .choice__arrow{right:18px;font-size:25px}
    }
    @media(prefers-reduced-motion:reduce){.choice{transition:none}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__brand">熊本支援まとめ</div>
    </div>
  </header>

  <main id="main">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">熊本の支援情報、</h1>
      <p>被災した住民・会社と、<br>復旧・施工で来ている人。</p>
    </section>

    <nav class="choice-list" aria-label="支援情報を立場から選ぶ">
      <a class="choice choice--resident" href="./resident.html">
        <div class="choice__content">
          <span class="choice__label">被災者支援</span>
          <h2>現地住民の人</h2>
          <p>熊本で暮らしている被災した人向け。<br>家の修理、仮住まい、生活の支援を見る。</p>
        </div>
        <span class="choice__arrow" aria-hidden="true">›</span>
      </a>

      <a class="choice choice--work" href="./genba.html">
        <div class="choice__content">
          <span class="choice__label">復旧・事業者支援</span>
          <h2>現場・被災した会社</h2>
          <p>熊本へ応援に来ている会社・職人と、被災した事業者向け。<br>高速代、宿泊・移動費、融資、片付けなどを見る。</p>
        </div>
        <span class="choice__arrow" aria-hidden="true">›</span>
      </a>
    </nav>

    <p class="page-note">非公式のまとめです。制度の条件・受付状況は、各ページから公式情報を確認してください。</p>
  </main>
</body>
</html>
